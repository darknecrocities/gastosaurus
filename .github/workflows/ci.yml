name: Gastosaurus CI/CD Quality Gates

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Code Quality, Tests, Line Limits & Security
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Verify 500-Line Source File Policy
        run: python3 scripts/check_source_line_limits.py --path . --max-lines 500

      - name: Run Ambayan Splitting & Settlement Unit Tests
        run: node --test server/test/splitting.test.js

      - name: Verify Production Frontend Build
        run: npm run build

      - name: Run Security Audit
        run: npm audit --audit-level=high

      - name: Guard Against Secret Leaks
        run: |
          if git ls-files | grep -E '\.env$|\.env\.local$|\.pem$|\.key$'; then
            echo "::error::Sensitive environment or credential file committed to git!"
            exit 1
          fi
          echo "Secret hygiene gate passed."
